services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: videodoc
      POSTGRES_PASSWORD: videodoc
      POSTGRES_DB: videodoc
    ports: ["5432:5432"]
    volumes: ["videodoc-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["videodoc-minio:/data"]
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on: [minio]
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/video-to-doc"
volumes:
  videodoc-postgres:
  videodoc-minio:
